<!DOCTYPE html>
<html>
<body style="font-family: 'Roboto', sans-serif; color: #212529; background: #f8f9fa; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);">
        <h2 style="color: #1e3a8a;">Verify Your Email</h2>
        <p>Hello {{ user.first_name }} {{ user.last_name }},</p>
        <p>Please click the button below to verify your email address:</p>
        <a href="{{ verify_url }}" style="display: inline-block; background: linear-gradient(90deg, #3b82f6, #60a5fa); color: white; padding: 10px 20px; border-radius: 25px; text-decoration: none; font-weight: 500;">Verify Email</a>
        <p>If you did not register, please ignore this email.</p>
        <p>Thank you,<br>The Password Manager Team</p>
    </div>
</body>
</html>
