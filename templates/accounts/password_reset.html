{% extends 'base.html' %}
{% block title %}Reset password{% endblock %}
{% block content %}<div class="card form-page mx-auto"><h1 class="h3">Reset password</h1><p>Enter your account email to receive a reset link.</p><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Send reset link</button></form><a class="mt-3" href="{% url 'accounts:login' %}">Back to sign in</a></div>{% endblock %}
