{% extends 'base.html' %}
{% block title %}Set new password{% endblock %}
{% block content %}<div class="card form-page mx-auto"><h1 class="h3">Set new password</h1>{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Change password</button></form>{% else %}<p class="alert alert-danger">This reset link is invalid or has expired.</p><a href="{% url 'accounts:password_reset' %}">Request a new reset link</a>{% endif %}</div>{% endblock %}
