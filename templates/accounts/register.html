{% extends 'base.html' %}
{% block title %}Create account{% endblock %}
{% block content %}<div class="card form-page mx-auto"><h1 class="h3">Create account</h1><p>Use a unique password of at least 12 characters.</p><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Create account</button></form><p class="mt-3">Already registered? <a href="{% url 'accounts:login' %}">Sign in</a></p></div>{% endblock %}
