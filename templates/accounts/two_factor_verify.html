{% extends 'base.html' %}
{% block title %}Two-Factor Authentication{% endblock %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card">
                <h2>Two-Factor Authentication</h2>
                <p>Enter the code from your Google Authenticator app.</p>

                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="otp_token" class="form-label">OTP Token</label>
                        <input type="text" name="otp_token" id="otp_token" class="form-control" required>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary">Verify</button>
                    </div>
                </form>
                <p class="mt-3">
                    Lost your device? <a href="{% url 'accounts:recovery_login' %}">Use a recovery code</a>.
                </p>
            </div>
        </div>
    </div>
{% endblock %}
